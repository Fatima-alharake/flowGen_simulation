[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgen"
version = "0.1.0"
description = "Lightweight generative spatial super-resolution and uncertainty estimation for 2D fluid dynamics"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Fatima Al-Harake", email = "fatima_alharake@outlook.com" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "h5py>=3.8.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "einops>=0.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flowgen*"]
